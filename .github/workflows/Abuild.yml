name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Birlestir ve derle
        run: |
          unzip -q proje.zip -d proje
          unzip -q aura-update.zip -d upd
          ROOT="$(dirname "$(find proje -name gradlew | head -n1)")"
          SRC="$(find upd -type d -path '*src/main' | head -n1)"
          cp -r "$SRC"/. "$ROOT/src/main/"
          CLIENT="$(find "$ROOT/src" -name ModIDClient.java | head -n1)"
          grep -q 'Wexa.register' "$CLIENT" || sed -i 's/NoRender.register();/NoRender.register();\n        Wexa.register();/' "$CLIENT"
          grep -q 'Wexa.register' "$CLIENT" || sed -i 's/Modules.init();/Modules.init();\n        Wexa.register();/' "$CLIENT"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp $(ls build/libs/*.jar | grep -v -e sources -e dev) "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: out/*.jar
        
